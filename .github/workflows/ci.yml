# Purpose: pull-request checks: ruff + pytest (backend), typecheck + build (frontend), terraform fmt/validate + tflint + Checkov, agent image build, Cedar file sanity check.
name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/agent/requirements*.txt }
      - run: pip install -r backend/agent/requirements-dev.txt
      - run: ruff check backend scripts
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid
          VITE_COGNITO_AUTHORITY: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dummy
          VITE_COGNITO_CLIENT_ID: dummy
          VITE_COGNITO_DOMAIN: dummy.auth.us-east-1.amazoncognito.com

  terraform:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive
      - name: Checkov (IaC security)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true   # flip to false once baseline findings are triaged

  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build agent image (no push)
        run: docker build -t uw-agent:ci backend/agent

  policies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check Cedar files exist and reference the gateway placeholder
        run: |
          for f in policies/*.cedar; do grep -q '${GATEWAY_ARN}' "$f" || { echo "missing placeholder in $f"; exit 1; }; done
